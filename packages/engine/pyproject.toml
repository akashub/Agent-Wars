[project]
name = "agentwars"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akashub", email = "91375293+akashub@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
aw = "agentwars.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/agentwars/cli.py" = ["B008"]
